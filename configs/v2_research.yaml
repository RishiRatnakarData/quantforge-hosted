# Reference configuration for the locked V2 development study.
# Values currently live in module defaults; this file records, not overrides, them.
source: V1_development_portfolio_outputs
risk_target: equal_weight_investable_net_return_after_costs
research_end: 2018-12-31
holdout: 2019_to_2025_excluded
volatility_target: squared_one_day_net_return
forecast_horizon_trading_sessions: 1
confidence: 0.95
ml:
  earliest_training_sessions: 252
  refit_every_sessions: 63
  training_window_cap_sessions: 756
  ridge_alpha: 12.0
  gradient_boosting_max_iterations: 60
  gradient_boosting_max_leaf_nodes: 7
  gradient_boosting_learning_rate: 0.05
  gradient_boosting_l2: 3.0
  random_seed: 11
regime:
  states: 2
  gaussian_em_iterations: 15
  max_fitting_window_sessions: 504
  refit_every_sessions: 126
  fit_uses_historical_backward_smoothing_only: true
  forecast_uses_forward_filter_only: true
simulation:
  horizon_trading_sessions: 21
  paths: 20000
  seed: 20261022
  drift_scenarios: [zero, historical_mean]
options:
  model: Black_Scholes_Merton_European
  currency: arbitrary_hypothetical
  dividends: continuous_yield
  call_monte_carlo_paths: 20000
