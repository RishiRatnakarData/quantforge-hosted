[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-financial-research"
version = "5.6.1"
description = "Private single-user investment desk with transparent finance analysis, portfolio math and paper trading"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Rishi Ratnakar"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "duckdb>=1.2,<2",
    "pyarrow>=17,<24",
    "requests>=2.31,<3",
    "qrcode>=8,<9",
    "plotly>=5.20,<7",
    "exchange-calendars>=4.5,<5",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "fastapi>=0.115,<1", "httpx>=0.27,<1", ]

[project.scripts]
quantforge = "quantforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
"quantforge.public" = ["template.html"]
"quantforge.simulator" = ["stock_template.html"]
"quantforge.desk" = ["investment_desk.html"]
