name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repair_only:
        description: Run focused proxy and authentication validation to conserve free minutes
        type: boolean
        default: false
      browser_only:
        description: Run browser acceptance only after unchanged application code passed numerical CI
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  validate:
    if: ${{ !inputs.repair_only && !inputs.browser_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check publication privacy and documentation
        run: python tools/prepublish_check.py
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Hosted site build and API security tests
        run: |
          python tools/build_unified_site.py
          python -m pytest -q tests/test_hosted_web.py
      - name: JavaScript syntax validation (public, private, and API proxy)
        run: |
          for source in web/site/*.js functions/api/*.js; do node --check "$source"; done
      - name: Full public and private JavaScript regression suite
        run: node --test web/tests/*.test.cjs
      - name: Validate compiled public CSP and release boundaries
        run: python tools/audit_public_bundle.py
      - name: End-to-end offline smoke test
        run: python -m quantforge demo --output outputs/ci-demo --rows 330
      - name: Verify smoke-test artifacts
        run: |
          python -c "from pathlib import Path; p=Path('outputs/ci-demo'); assert all((p/f).stat().st_size > 20 for f in ['summary.json','manifest.json','prices.csv','returns.csv','risk_forecasts.csv','risk_coverage.csv','portfolio_comparison.csv','research_dashboard.html','quantforge.duckdb','prices.parquet','returns.parquet']); print('Smoke-test artifacts verified')"
      - name: V1 development research offline integration
        run: python -m quantforge v1-demo --rows 520 --output outputs/ci-v1
      - name: Verify V1 research artifacts
        run: |
          python -c "from pathlib import Path; p=Path('outputs/ci-v1'); assert all((p/f).stat().st_size > 30 for f in ['manifest_v1.json','RESEARCH_SUMMARY.md','risk_dashboard.html','risk_forecasts.csv','risk_diagnostics.csv','portfolio_metrics.csv','portfolio_paths.csv','cost_rebalance_sensitivity.csv']); print('V1 research artifacts verified')"

      - name: V2 advanced research integrated simulated smoke test
        run: python -m quantforge v2-demo --rows 520 --output outputs/ci-v2
      - name: Verify V2 evidence and research boundaries
        run: |
          python -c "from pathlib import Path; p=Path('outputs/ci-v2/v2_results'); assert all((p/f).stat().st_size > 50 for f in ['manifest_v2.json','V2_RESEARCH_REPORT.md','advanced_dashboard.html','advanced_forecasts.csv','forecast_model_scores.csv','var_coverage_comparison.csv','option_model_validation.json','option_sensitivity.csv','portfolio_monte_carlo.json','variance_forecast_stability.csv']); print('V2 integrated artifacts verified')"

      - name: V3 full offline SEC-fixture and DCF smoke test
        run: python -m quantforge v3-demo --as-of 2026-10-22 --output outputs/ci-v3
      - name: Verify V3 valuation and source-attribution artifacts
        run: |
          python -c "from pathlib import Path; p=Path('outputs/ci-v3'); assert all((p/f).stat().st_size > 100 for f in ['manifest_v3.json','sec_financials.csv','sec_fact_audit.csv','forecast_drivers.csv','dcf_scenarios.csv','dcf_sensitivity.csv','valuation_dashboard.html','INVESTMENT_MEMO.md']); print('V3 synthetic financial and valuation artifacts verified')"

      - name: V4 integrated synthetic research and dashboard smoke test
        run: python -m quantforge v4-demo --rows 520 --output outputs/ci-v4
      - name: Verify V4 evidence and provenance
        run: |
          python -c "from pathlib import Path; import json; p=Path('outputs/ci-v4/integrated'); req=['evidence_manifest.json','INVESTMENT_MEMO.md','integrated_dashboard.html','capex_stress.json','model_uncertainty.csv','views/advanced_models.html','views/portfolio_risk.html','views/company_valuation.html']; assert all((p/f).stat().st_size>100 for f in req); assert not list(p.glob('RESEARCH_WORKING_PAPER*')); m=json.loads((p/'evidence_manifest.json').read_text()); assert m['market_data_origin']=='simulation' and m['holdout_2019_2025']=='not_accessed'; print('V4 provenance verified; no paper')"

      - name: Public recruiter-site offline demonstration
        run: python -m quantforge public-demo --rows 390 --output outputs/ci-public
      - name: Validate public HTML and synthetic labels
        run: |
          python -c "from pathlib import Path; p=Path('outputs/ci-public/site/index.html'); t=p.read_text(encoding='utf-8'); assert p.stat().st_size>12000; assert 'SYNTHETIC OFFLINE DEMONSTRATION' in t; assert 'ECB' in t; print('Public site validated')"

      - name: V4.2 stock simulator offline end-to-end smoke test
        run: python -m quantforge stock-demo --sessions 150 --output outputs/ci-stock
      - name: Verify stock simulator provenance and website
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/ci-stock')
          evidence=json.loads((root/'site/evidence.json').read_text())
          assert evidence['dataset_origin']=='synthetic'
          assert (root/'site/index.html').stat().st_size > 30_000
          assert (root/'stock_bars.csv').stat().st_size > 1000
          print('V4.2 synthetic site artifacts verified')
          PY

  release_a_browser:
    if: ${{ !inputs.repair_only }}
    name: Release A-D shared-app browser journeys (${{ matrix.group }})
    # Playwright 1.57 predates the ubuntu-latest move to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The complete suite exceeds one 30-minute runner slot. Each script runs
    # once across two balanced groups; numerical and security gates stay intact.
    strategy:
      fail-fast: false
      matrix:
        group: [core, research]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # GitHub's regional EC2 mirror repeatedly stalled before tests started.
      # Use the official HTTPS fallback mirrors already supplied by runner-images;
      # retain Ubuntu's signed sources, all browsers, and every acceptance script.
      - name: Bound official Ubuntu browser dependency acquisition
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          grep -q 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/zzzz-quantforge-ci
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Install offline browser test dependency
        run: |
          python -m pip install playwright==1.57.0 "requests>=2.31"
          timeout 8m python -m playwright install --with-deps chromium firefox webkit
      - name: Build generated public site with deterministic CSP
        run: python tools/build_unified_site.py
      - name: Verify desktop, mobile, keyboard, routing and mocked private outage
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_release_a_browser.py
      - name: Verify Release B Compare, Portfolio, owner accounting and provider-failure isolation
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_release_b_browser.py
      - name: Verify Release C Models, Methods, source scope and private gating
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_release_c_browser.py
      - name: Verify unified private shell, mocked MFA, notes, virtual trades and logout
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_release_d_browser.py
      - name: Product rebuild desktop and mobile acceptance
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_rebuild_browser.py
      - name: Completed engines under real CSP in Chromium Firefox WebKit
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_completion_browser.py
      - name: Product picker transactions news and worked-method acceptance
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_product_v27.py
      - name: Final audit account and research workflows in three browsers
        if: ${{ matrix.group == 'core' }}
        env:
          QF_FINAL_WIDTHS: 320,390,768,1024,1440
        run: python tools/smoke_final24_browser.py
      - name: Independent quality, keyboard, reload and context-race regressions
        if: ${{ matrix.group == 'core' }}
        run: python tools/smoke_quality_browser.py
      - name: All named views and component readability at five widths and zoom reflow
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_final24_layout.py

      - name: Guided research health and append-only thesis workflows
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_guided_research.py
      - name: Private transient startup recovery and unauthorized non-retry
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_private_recovery_v31.py
      - name: Verified session reload expiry and sign-out races in three browsers
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_session_lifecycle_v31.py
      - name: Fresh HTTPS Home and company search at five widths
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_home_entry_v31.py

      - name: Readiness before credentials and final Home research workflows
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_final_release32.py

      - name: Integrated assessment and safe stale-preview acceptance
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_master_quality_v33.py

      - name: Shared five-section navigation, research home and current-assessment acceptance
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_consolidation_v34.py

      - name: Bounded batch research and source-isolation acceptance
        if: ${{ matrix.group == 'research' }}
        run: python tools/smoke_definitive_v35.py

  readiness_repair:
    name: Focused readiness and security validation
    if: ${{ inputs.repair_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hosted security test dependencies
        run: python -m pip install -r cloud/requirements.txt pytest httpx pandas
      - name: Build and verify publication boundaries
        run: |
          python tools/build_unified_site.py
          python tools/audit_public_bundle.py
          python tools/prepublish_check.py
          git diff --exit-code -- public
      - name: Full JavaScript regression suite
        run: node --test web/tests/*.test.cjs
      - name: Hosted authentication and ledger security regressions
        run: python -m pytest -q tests/test_hosted_web.py
